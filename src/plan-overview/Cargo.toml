# MODE: DEV
# PACKAGE: PROD
[package]
name = "plan-overview"
version = "0.1.0"
edition = "2021"
description = "Owned plan-tree reader and canonical overview state model"
license = "MIT"

[features]
test-per-field-buffer = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
