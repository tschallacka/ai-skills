# MODE: DEV
# PACKAGE: PROD
# One binary with subcommands, not one binary per verb: CODE-STYLE 1b is one
# binary per crate, and a host that has no bash needs the client verbs as badly
# as the server. Source is dev-only — users receive the compiled artifact
# declared in chat/binaries.tsv and need no Rust toolchain.
[package]
name = "chat"
version = "0.1.0"
edition = "2021"
description = "The ai-skills chat bus: one server subcommand and the client verbs, so a host with no bash still has a full client"
license = "MIT"

# No dependencies on purpose. The singleton needs an OS lock whose ownership
# dies with the process; flock(2) is declared directly rather than pulling in
# libc, and Windows uses a std-only exclusive share mode. Keeping the crate
# dependency-free also keeps the static musl build trivial.
[dependencies]

[profile.release]
lto = "thin"
strip = true

# cargo-dist builds with --profile dist and fails if it is absent.
[profile.dist]
inherits = "release"
lto = "thin"
