# MODE: DEV
[workspace]
resolver = "2"
members = [
    "chat-proto",
    "chat-server-rs",
    "chat-client-rs",
]

# Workspace-wide release profile: crates that share the compiled direction must
# not each declare a conflicting local profile (cargo warns and ignores them).
[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
