# MODE: DEV
# PACKAGE: PROD
[package]
name = "interactive-shell"
version = "0.1.0"
edition = "2021"

[lib]
name = "interactive_shell_core"
path = "src/lib.rs"

[[bin]]
name = "interactive-shell"
path = "src/bin/interactive-shell.rs"

[[bin]]
name = "interactive-shell-input"
path = "src/bin/interactive-shell-input.rs"

[[bin]]
name = "interactive-shell-fixture"
path = "src/bin/interactive-shell-fixture.rs"

[dependencies]
# Caret ranges, not "=" pins: this crate is a member of the root workspace, so
# the single root Cargo.lock picks the version. An exact pin would either force
# a second copy of serde/libc into that lock or drag all 79 members back to
# this crate's older choice. Profiles are the root's for the same reason.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tcp.rs's nonce() needs this on every platform now: --tcp is an explicit
# opt-in transport on Unix (alongside the default posix.rs socket transport),
# not just Windows's only transport, so this moved out of the
# cfg(windows)-only dependency set below.
getrandom = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
