# MODE: DEV
# PACKAGE: PROD
[package]
name = "todo-register"
version = "0.1.0"
edition = "2021"
description = "The work queue's tools: add, close, read and merge TODO.json, with the queue's rules as types"
license = "MIT"

[[bin]]
name = "todo"
path = "src/main.rs"

[dependencies]
planning-core = { path = "../planning-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
