[package]
name = "planning-validator-goals"
version = "0.1.0"
edition = "2021"
description = "Goal and step validation for planning documents"
license = "MIT"

[lib]
name = "planning_validator_goals"
path = "src/lib.rs"

[dependencies]
planning-validator-common = { path = "../planning-validator-common" }
planning-validator-inventory = { path = "../planning-validator-inventory" }
serde_json = { version = "1", features = ["preserve_order"] }
