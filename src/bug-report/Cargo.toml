# MODE: DEV
# PACKAGE: PROD
[package]
name = "bug-report"
version = "0.1.0"
edition = "2021"
description = "The defect register's tools: file, close, read and merge BUGS.json, with the register's rules as types"
license = "MIT"

[[bin]]
name = "bugs"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
