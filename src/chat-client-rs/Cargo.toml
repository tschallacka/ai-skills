# MODE: DEV
# PACKAGE: PROD
[package]
name = "chat-client-rs"
version = "0.1.0"
edition = "2021"
description = "The TLS chat client: discovers, connects (TOFU), sends, reads deltas, and tails an IRC-grammar chat server"
license = "MIT"

[lib]
name = "chat_client_rs"
path = "src/lib.rs"

[[bin]]
name = "chat-client-rs"
path = "src/bin/chat-client-rs.rs"

[dependencies]
chat-proto = { path = "../chat-proto" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
# No webpki-roots: TOFU pins the server cert directly.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# T111: the control connection's loopback-TCP arm (Windows has no unix
# socket) proves its shared secret via an HMAC challenge/response rather than
# sending it in the clear -- the same primitives ai-text-editor's own TCP
# fallback uses.
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
