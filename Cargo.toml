# MODE: DEV
[workspace]
resolver = "2"
members = ["src/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["tsch-ai-skills contributors"]

[workspace.dependencies]
base64 = "0.22"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
regex = "1"
pcre2 = "0.2"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
tempfile = "3"
hmac = "0.12"
getrandom = "0.3"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

[profile.dist]
inherits = "release"
