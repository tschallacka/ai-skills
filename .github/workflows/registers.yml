# MODE: DEV
# Fast-forward the `registers` branch onto master once it is safe to do so.
#
# BUGS.json and TODO.json are append-mostly arrays, so two branches that each
# file an entry both take the same next free id -- and git cannot see that: the
# additions land at different array positions, so it merges them textually with
# NO conflict and master ends up with two unrelated entries under one id. Eight
# of those arrived in a single merge on 2026-09-04, invisible until reg_findings
# ran. The register branch makes one writer, and this workflow is what lets that
# writer reach master without waiting for a human to press merge.
#
# It is deliberately not the general CI: a register change touches no code, so
# building 83 crates to land a bug entry is waste. What it does run is the check
# git cannot do -- see .github/registers-guard.sh -- plus the shipped register
# tools when a built tree happens to be available.
name: registers

on:
  push:
    branches: [registers]

# Only the merge step needs write access, and it is the only place a token can
# reach master. Read-only for everything else.
permissions:
  contents: write

concurrency:
  # Two pushes to `registers` must not race each other onto master: the second
  # would fast-forward from a base the first has already moved. Queue them.
  group: registers-to-master
  cancel-in-progress: false

jobs:
  guard-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the register branch with master alongside it
        uses: actions/checkout@v4
        with:
          # The guard diffs against master, so a shallow clone is not enough.
          fetch-depth: 0
          # REGISTERS_PUSH_TOKEN, when set, is what makes the final step able to
          # land. master carries classic branch protection with required status
          # checks, and those block a DIRECT push as well as a merge -- the
          # default GITHUB_TOKEN cannot bypass them, so without this secret the
          # run reaches the push and fails, deliberately and loudly.
          #
          # enforce_admins is off on this repository, so an admin's token
          # pushes directly. A fine-grained PAT with contents:write, or a
          # GitHub App installation token, is enough; no protection change is
          # needed, which is the point -- relaxing protection would weaken
          # every other path to fix this one.
          #
          # What keeps that power narrow is registers-guard.sh, not the token:
          # GitHub can grant a bypass to an ACTOR but cannot make it
          # conditional on "only these two files changed". That condition can
          # only live in code, and it runs before the push is attempted.
          token: ${{ secrets.REGISTERS_PUSH_TOKEN || github.token }}

      - name: Refuse anything but a register change
        run: |
          set -euo pipefail
          git fetch --quiet origin master
          ./.github/registers-guard.sh --base origin/master

      - name: Validate with the shipped register tools, if a build is present
        run: |
          set -uo pipefail
          triple="$(rustc -vV 2>/dev/null | sed -n 's/^host: //p')"
          bugs="bin/${triple:-none}/bugs"
          todo="bin/${triple:-none}/todo"
          if [ -x "$bugs" ]; then
            "$bugs" check
          else
            printf 'no built %s; the guard already refused a duplicate id or a dangling parent\n' "$bugs"
          fi
          if [ -x "$todo" ]; then
            "$todo" check || true
          fi

      - name: Fast-forward master
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A fast-forward only. If master has moved to something this branch
          # does not contain, the register branch is stale and a human should
          # rebase it -- silently merging would be the textual merge this whole
          # arrangement exists to avoid.
          if ! git merge-base --is-ancestor origin/master HEAD; then
            printf 'registers is not a fast-forward of master; rebase it onto master and push again\n' >&2
            printf 'master:    %s\n' "$(git rev-parse --short origin/master)" >&2
            printf 'registers: %s\n' "$(git rev-parse --short HEAD)" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet origin/master >/dev/null \
             && [ "$(git rev-parse origin/master)" = "$(git rev-parse HEAD)" ]; then
            printf 'master already carries this; nothing to do\n'
            exit 0
          fi
          # Branch protection may refuse this push. That is not something to
          # work around quietly: the run fails, and the entry waits for a human
          # rather than the register silently diverging from master.
          if ! git push origin "HEAD:master"; then
            printf '\n' >&2
            printf 'the push to master was refused. master has classic branch protection\n' >&2
            printf 'with required status checks, and those block a direct push too; the\n' >&2
            printf 'default GITHUB_TOKEN cannot bypass them.\n' >&2
            printf '\n' >&2
            printf 'The fix is a repository secret named REGISTERS_PUSH_TOKEN holding a\n' >&2
            printf 'fine-grained PAT with contents:write (or a GitHub App installation\n' >&2
            printf 'token). enforce_admins is off here, so an admin token pushes\n' >&2
            printf 'directly and no protection change is required.\n' >&2
            printf '\n' >&2
            printf 'Do NOT relax the protection itself to make this one path work, and\n' >&2
            printf 'do NOT remove the guard: the token is what makes the push possible,\n' >&2
            printf 'the guard is what keeps it to the two registers.\n' >&2
            printf '\n' >&2
            printf 'Until then, merge the registers branch by hand -- the entries are\n' >&2
            printf 'sound, this step is the only thing that did not happen.\n' >&2
            exit 1
          fi
          printf 'master fast-forwarded to %s\n' "$(git rev-parse --short HEAD)"
