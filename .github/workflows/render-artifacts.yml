name: render-artifacts

on:
  workflow_dispatch:
  push:
    branches: [master, nextupdate]
  pull_request:

jobs:
  build:
    name: plan-overview ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, package: plan-overview }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, package: plan-overview }
          - { os: macos-13, target: x86_64-apple-darwin, package: plan-overview }
          - { os: macos-14, target: aarch64-apple-darwin, package: plan-overview }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, package: plan-overview.exe }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools gcc-aarch64-linux-gnu

      - name: Install Rust 1.86.0
        uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: ${{ matrix.target }}

      - name: Build artifact
        if: runner.os != 'Windows'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --manifest-path src/plan-overview/Cargo.toml --target ${{ matrix.target }}

      - name: Build artifact on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --release --manifest-path src/plan-overview/Cargo.toml --target ${{ matrix.target }}

      - name: Execute artifact
        if: runner.os != 'Windows'
        run: target/${{ matrix.target }}/release/${{ matrix.package }} --help

      - name: Execute artifact on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\target\${{ matrix.target }}\release\${{ matrix.package }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plan-overview-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.package }}
