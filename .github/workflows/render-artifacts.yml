name: render-artifacts

on:
  workflow_dispatch:
  push:
    branches: [master, nextupdate]
  pull_request:

jobs:
  build:
    name: plan-overview ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One runner per target, so every artifact is built and executed
        # natively. Cross-building aarch64 on an x86 runner produces a binary
        # the same job then cannot run.
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, package: plan-overview }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, package: plan-overview }
          - { os: macos-15-intel, target: x86_64-apple-darwin, package: plan-overview }
          - { os: macos-latest, target: aarch64-apple-darwin, package: plan-overview }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, package: plan-overview.exe }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Only the crate is needed to build it. The full tree also carries
          # fixture paths long enough to fail checkout on the Windows runner.
          sparse-checkout: |
            src/plan-overview

      - name: Install the musl C cross-toolchain
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get install -y -qq musl-tools

      - name: Pin the toolchain the crate declares
        uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: ${{ matrix.target }}

      - name: Ensure the target standard library is installed
        run: rustup target add --toolchain 1.86.0 "${{ matrix.target }}"

      - name: Build artifact
        working-directory: src/plan-overview
        run: cargo build --release --target ${{ matrix.target }}

      - name: Execute artifact
        if: runner.os != 'Windows'
        working-directory: src/plan-overview
        run: target/${{ matrix.target }}/release/${{ matrix.package }} --help

      - name: Execute artifact on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: src/plan-overview
        run: .\target\${{ matrix.target }}\release\${{ matrix.package }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plan-overview-${{ matrix.target }}
          path: src/plan-overview/target/${{ matrix.target }}/release/${{ matrix.package }}
          if-no-files-found: error
