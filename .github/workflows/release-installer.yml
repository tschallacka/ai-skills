# MODE: DEV
# Attach the Rust installer's per-platform release assets to a GitHub Release.
#
# RELEASE.md's own protocol is otherwise entirely manual: a maintainer tags,
# builds dist/ai-skills-<version>.tar.gz by hand, and attaches it through the
# GitHub UI. That tarball is install.sh's payload; it carries no installer
# binary and is not split per platform, so it cannot be what
# installer/bootstrap.sh downloads. This workflow adds the five
# ai-skills-<target-triple>.tar.gz assets bootstrap.sh (or, on Windows, a
# maintainer downloading the asset directly) needs, without changing
# anything about the existing manual step -- the maintainer still creates
# the release and still attaches the universal tarball by hand; this only
# adds to it, once that release exists.
#
# ONE JOB PER PLATFORM, same reasoning as ci.yml's `native` job: each asset is
# built by installer/build-installer-release.sh on that platform's own native
# runner, because a cross build that cannot run is not the same claim as one
# that was actually executed there. Windows has a leg too: installer/bootstrap.sh
# maps x86_64 Git for Windows' bash, MSYS and Cygwin to the
# x86_64-pc-windows-msvc asset, so this is the asset that launcher downloads.
#
# Triggered by publishing a GitHub Release (covers both a fresh tag and
# republishing an existing draft), and by workflow_dispatch for a maintainer
# who needs to re-run one platform's leg after the fact -- the tag must
# already exist as a release for gh release upload to have somewhere to
# attach to.

name: release-installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the installer assets to
        required: true

# Only the upload step needs write access; everything else here is read-only.
permissions:
  contents: write

jobs:
  build-and-attach:
    name: ${{ matrix.target }} installer asset
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      # Windows only, and before checkout so it applies to it: Git for
      # Windows otherwise writes CRLF into every shell script it checks out.
      - name: Check out with LF endings
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          # Everything except benchmark/results/: its archived runs hold
          # paths longer than Windows allows, and checking them out fails
          # the windows-latest leg the same way it does in ci.yml's own
          # native job and release-npm.yml's build job (T70/W06, found by a
          # real dry run: every path here failed with "Filename too long").
          # build-installer-release.sh never reads that directory.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/benchmark/results/

      # `bash` on a windows-latest PATH can resolve to C:\Windows\System32\
      # bash.exe, the WSL launcher, which fails when no distro is installed.
      # Git for Windows' own bash goes first, with the GNU tools beside it.
      - name: Put Git for Windows' bash and coreutils first on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: |
          {
            printf '%s\n' 'C:\Program Files\Git\bin'
            printf '%s\n' 'C:\Program Files\Git\usr\bin'
          } >> "$GITHUB_PATH"

      - name: Pin the toolchain and target
        uses: dtolnay/rust-toolchain@1.98
        with:
          targets: ${{ matrix.target }}

      # dtolnay/rust-toolchain's own targets: input does not reliably
      # survive to a later step's cargo invocation once build-installer-
      # release.sh's own nested cargo calls are involved (T70/W06: measured
      # via a real dry run -- every leg failed with "can't find crate for
      # core/std", the exact defect class release-npm.yml's own identical
      # step already documents and fixes). Re-added explicitly, matching
      # that precedent and this repo's other working cross-target steps.
      - name: Ensure the target's std library is actually installed
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Install the musl C toolchain
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get install -y -qq musl-tools

      # build-installer-release.sh's own "build" mode (via build-release.sh)
      # is what actually builds the chat/register binaries, rjq, the plan
      # libraries and REVIEWER.md -- everything install.sh's release already
      # needs, so a release leg pays the same cost the manual "build the
      # package" step in RELEASE.md already pays, once per platform instead
      # of once on the maintainer's own machine.
      #
      # Explicit `shell: bash` on both remaining steps: windows-latest's
      # default `run:` shell is PowerShell, and both of these are bash
      # scripts (build-installer-release.sh, and the gh upload one-liner).
      - name: Build this platform's installer release asset
        shell: bash
        run: ./installer/build-installer-release.sh --target ${{ matrix.target }}

      - name: Attach the asset to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ github.event.release.tag_name || inputs.tag }}'
          gh release upload "$tag" "dist/ai-skills-${{ matrix.target }}.tar.gz" \
            --repo "${{ github.repository }}" --clobber
