name: "T84 scratch: ConPTY backend proof (temporary -- removed once evidence is captured)"

# Not part of the plan's permanent CI surface. This proves windows.rs's
# WindowsBackend (goal 02-conpty-backend, W13) works against a real
# cmd.exe on a real windows-latest runner, in isolation from the crate's
# normal client()/run() entry point -- interactive-shell has no Windows
# transport yet (goal 3, W14/W15), so `cargo test --workspace` still
# excludes it on Windows in ci.yml. This job builds and runs ONLY
# interactive-shell's --lib target, which is enough to reach the
# `windows::tests` module without needing that transport to exist.
#
# Runs on the throwaway PR that carries this scratch job (GitHub will not
# dispatch a brand-new workflow_dispatch trigger from a non-default branch
# until the workflow file exists on the default branch, so pull_request is
# the only way to fire this before goal 2's real PR merges). Also kept as
# workflow_dispatch for a manual re-run once that registration exists.
on:
  workflow_dispatch: {}
  pull_request:
    branches: [nextupdate]

jobs:
  conpty-proof:
    name: windows.rs Backend round trip (spawn/write/read/resize/stop)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # A full checkout hits Windows' MAX_PATH on this repo's deeply
          # nested benchmark/results fixtures (the same reason ci.yml's own
          # windows-latest leg sparse-checks out too); this job only needs
          # the workspace sources.
          sparse-checkout: |
            src
            Cargo.toml
            Cargo.lock
            rust-toolchain.toml

      - name: Pin the toolchain and target
        uses: dtolnay/rust-toolchain@1.98
        with:
          targets: x86_64-pc-windows-msvc

      # Real CI runs showed the ConPTY-attached child (cmd.exe consistently,
      # powershell.exe intermittently) exiting almost immediately (code 0,
      # no prompt ever printed), with the "sometimes works, sometimes
      # doesn't, always a clean exit code" pattern pointing at Defender's
      # real-time behavioral scanning racing the process launch --
      # CreateProcess+PROC_THREAD_ATTRIBUTE_PSEUDOCONSOLE is a documented
      # reverse-shell/C2 signature. This is a short-lived, throwaway
      # GitHub-hosted runner discarded after this job, so disabling
      # real-time monitoring for its lifetime is safe.
      - name: Disable Defender real-time monitoring for this ephemeral runner
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: cargo test --lib (windows::tests only)
        shell: bash
        working-directory: src/interactive-shell
        run: "cargo test --lib windows:: -- --nocapture --test-threads=1"
