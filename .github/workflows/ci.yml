name: ci

on:
  push:
    # master is the default branch (origin/HEAD -> origin/master); nextupdate is
    # the long-lived integration branch. Pushes to either run the full matrix.
    branches: [master, nextupdate]
  pull_request:

env:
  # All crates are members of the root workspace, so Cargo writes artifacts to
  # this one directory even when a command is launched from a crate directory.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

# A CI result is only meaningful for the newest commit ON ITS OWN REF, so the
# group is keyed by ref rather than being one global lane. A literal shared
# group means any push cancels every other pull request's in-flight run: the
# victim's board reads cancelled through no fault of its own, and the only way
# to get a verdict is to push again and hope nobody else does. That happened to
# three open pull requests before this was keyed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Proves: the deterministic suite passes, and leaks no temp files, on both
    # supported operating systems with each one's default bash.
    name: Test suite passes on ${{ matrix.os }} (default bash, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    # T116: the selected/sharded test list depends on the scope job's answer.
    needs: scope
    # The backstop for a hang. run-tests.sh bounds each TEST, which is what
    # names the culprit; this bounds the JOB, for a hang outside any test or a
    # runner that wedges. Without it a job inherits GitHub's 6-hour default:
    # measured 2026-09-08, three legs sat over three hours on one pull request
    # while every build leg had long since passed, and the only symptom was
    # the absence of a result. The local suite takes about 10 minutes, so 45
    # is generous enough never to fire on a slow runner; sharding only shortens
    # a leg, so the same ceiling still covers it.
    timeout-minutes: 45
    # Both operating systems are blocking. The macOS leg earned this once two
    # consecutive runner runs were green under both bash flavors (runs
    # 32474258670 and 32476867183), closing blocker 8; a macOS regression now
    # fails the PR instead of being informational.
    #
    # SHARD_TOTAL (T116) must equal the length of the shard array below --
    # kept as two adjacent literals in the same small diff on purpose, rather
    # than derived, because a wrong shard COUNT is a silent under-coverage bug
    # a green run cannot reveal (every shard still passes; some tests just
    # never ran in any of them), where a mismatched-length mistake here is at
    # least visible in review. test-run-tests-shard.sh independently proves
    # run-tests.sh's own --shard math partitions correctly for whatever N it
    # is given, which is the half a CI-only literal cannot cover.
    env:
      SHARD_TOTAL: 4
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # blast-radius.sh resolves a merge base against master and reads the
          # commits touching a path, and test-blast-radius.sh asks for the parent
          # of the newest commit touching planning/SKILL.md. The default depth-1
          # checkout has neither, so all three of its history assertions failed
          # here while passing locally -- reproduced with `git clone --depth 1`.
          fetch-depth: 0

      - name: Install the plan-overview toolchain floor
        uses: dtolnay/rust-toolchain@1.98
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-apple-darwin,aarch64-apple-darwin,x86_64-pc-windows-msvc
          components: rustfmt,clippy

      # test-release-package.sh's build-release.sh cross-compiles the whole
      # workspace for x86_64-unknown-linux-musl (chat-server-rs's own
      # dependency on `ring` needs a real C compiler for that target, not
      # just the Rust target's stdlib) -- the same musl-tools package the
      # "builds and runs every subject in scope" jobs already install below,
      # needed here too since this job never runs inside that one's shell.
      - name: Install the musl C toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq musl-tools

      - name: Refuse an unconfigured plan-overview crate leg
        env:
          REFUSE_UNCONFIGURED_CARGO: 1
        run: |
          rustc --version | grep "1.98"
          cargo test --manifest-path src/plan-overview/Cargo.toml

      - name: Record the bash under test
        run: bash --version

      - name: Build and expose the native rjq test binary
        uses: dtolnay/rust-toolchain@1.98

      - name: Add bundled rjq to PATH for the suite
        shell: bash
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          case "$host" in
            x86_64-unknown-linux-*) target=x86_64-unknown-linux-musl; dir=x86_64-unknown-linux-musl ;;
            aarch64-unknown-linux-*) target=aarch64-unknown-linux-musl; dir=aarch64-unknown-linux-musl ;;
            x86_64-apple-darwin) target=x86_64-apple-darwin; dir=x86_64-apple-darwin ;;
            aarch64-apple-darwin) target=aarch64-apple-darwin; dir=aarch64-apple-darwin ;;
            *) echo "::error::unsupported rjq test host: $host"; exit 1 ;;
          esac
          rustup target add "$target"
          cargo build --release --manifest-path src/rjq/Cargo.toml --target "$target"
          mkdir -p "planning/bin/$dir"
          cp "$GITHUB_WORKSPACE/target/$target/release/rjq" "planning/bin/$dir/rjq"
          echo "$PWD/planning/bin/$dir" >> "$GITHUB_PATH"

      - name: Put GNU coreutils first on the macOS runner
        # The suite's date, stat and readlink expectations are the GNU ones. BSD
        # userland is a supported target (CODE-STYLE.md section 1) and is covered
        # by the bash 3.2 floor leg; this leg tests the default shell, not the
        # default userland.
        run: |
          if command -v brew >/dev/null 2>&1; then
            brew install coreutils
            echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          fi

      - name: Install GNU nano, because macOS answers `nano` with Pico
        # cargo test -p interactive-shell --test pty_orchestration (T145 goal
        # 25; formerly the bash test-interactive-shell.sh) drives GNU nano's
        # own bindings -- META-RIGHT, CTRL-E, CTRL-O -- to prove the PTY
        # wrapper can operate a full-screen program. Stock macOS ships UW Pico
        # under that name (the runner reported "UW PICO 5.09" in its title
        # bar), which shares neither the title nor the keys, so the test
        # skips itself there rather than asserting against a different
        # program.
        #
        # Installing it keeps the assertions strict instead of widening them to
        # cover two editors: the subject is the wrapper, so pinning the program
        # removes a variable rather than adding a branch. This is the same
        # reasoning as the GNU coreutils step above.
        if: runner.os == 'macOS'
        run: |
          brew install nano
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install memlimit, so the resource wrapper's RAM cap is real where it can be
        # limited-run.sh caps memory with a transient systemd scope on Linux and
        # with memlimit on macOS. Without it the suite prints "the requested RAM
        # limit (2G) is not enforced" and runs UNCAPPED, so a test that eats
        # memory takes the runner down instead of failing inside its budget.
        #
        # NEITHER macOS ARCH CAN ENFORCE IT ON THESE RUNNERS, measured
        # 2026-09-04 and written up in .agents/knowledge/github-ci-runners.md.
        # Intel: memlimit publishes only memlimit-aarch64-apple-darwin, so there
        # is nothing to install. arm64: it installs and then cannot run, because
        # it works through DYLD_INSERT_LIBRARIES, which SIP strips for system
        # binaries -- its own installer says "no non-SIP shell found" -- and its
        # hook library is arm64 where the system is arm64e:
        #
        #   dyld: terminating because inserted dylib '.../hook-*.dylib' could
        #   not be loaded: (mach-o file, but is an incompatible architecture
        #   (have 'arm64', need 'arm64e'))
        #
        # So the probe's failure is a PLATFORM RESTRICTION, not a broken step,
        # and it reports `::notice` rather than failing the leg. A hard failure
        # here reddens every macOS run for something no change to this
        # repository can fix. What is still worth doing is installing it and
        # SAYING which of the two states we are in, so "uncapped" is a recorded
        # fact rather than a silence.
        #
        # MEMLIMIT_UNMANAGED_INSTALL pins the directory and switches off both
        # the installer's PATH editing and its self-updater, so the directory
        # added to PATH is provably the one installed into.
        if: runner.os == 'macOS'
        run: |
          if [ "$(uname -m)" != arm64 ]; then
            echo "::notice::memlimit is Apple Silicon only; $(uname -m) has no memory-cap mechanism, so the suite runs uncapped"
            exit 0
          fi
          root="$HOME/.local/memlimit"
          export MEMLIMIT_UNMANAGED_INSTALL="$root"
          curl -LsSf https://github.com/pingiun/memlimit/releases/latest/download/memlimit-installer.sh | sh
          bin=""
          for candidate in "$root/memlimit" "$root/bin/memlimit"; do
            if [ -x "$candidate" ]; then bin="$candidate"; break; fi
          done
          if [ -z "$bin" ]; then
            echo "::notice::memlimit did not install under $root; the suite runs uncapped"
            ls -lR "$root" || true
            exit 0
          fi
          if ! "$bin" 2147483648 -- /usr/bin/true; then
            echo "::notice::$bin installed but cannot cap a command on this runner (SIP strips DYLD_INSERT_LIBRARIES); the suite runs uncapped"
            exit 0
          fi
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
          echo "memlimit ready at $bin"

      - name: Build the compiled chat rung so its assertions run (T62)
        uses: dtolnay/rust-toolchain@1.98
        with:
          components: rustfmt, clippy

      - name: Place the compiled chat rung
        run: |
          # Build the chat crates natively and place the four binaries under
          # the chat/bin/<triple>/ dir skill_files() resolves for this host, so
          # the manifest and shipped-binaries tests see them. The dedicated
          # chat-binary job builds the cross/static artifacts for release.
          cargo build --release --manifest-path src/chat-server-rs/Cargo.toml
          cargo build --release --manifest-path src/chat-client-rs/Cargo.toml
          cargo build --release --manifest-path src/chat-mcp/Cargo.toml
          cargo build --release --manifest-path src/chat-spool-watch/Cargo.toml
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64|Linux:amd64) dir=x86_64-unknown-linux-musl ;;
            Linux:aarch64|Linux:arm64) dir=aarch64-unknown-linux-musl ;;
            Darwin:x86_64) dir=x86_64-apple-darwin ;;
            Darwin:arm64) dir=aarch64-apple-darwin ;;
            MINGW*:x86_64|MSYS*:x86_64|CYGWIN*:x86_64|Windows*:x86_64) dir=x86_64-pc-windows-msvc ;;
            *) echo "::error::unsupported host for chat binaries: $(uname -s):$(uname -m)"; exit 1 ;;
          esac
          mkdir -p "chat/bin/$dir"
          cp "$GITHUB_WORKSPACE/target/release/chat-server-rs" "chat/bin/$dir/chat-server-rs"
          cp "$GITHUB_WORKSPACE/target/release/chat-client-rs" "chat/bin/$dir/chat-client-rs"
          cp "$GITHUB_WORKSPACE/target/release/chat-mcp" "chat/bin/$dir/chat-mcp"
          cp "$GITHUB_WORKSPACE/target/release/chat-spool-watch" "chat/bin/$dir/chat-spool-watch"

      - name: Place the compiled register rungs
        run: |
          # The two register skills ship a prebuilt binary each, and
          # skill_files() lists the host's row, so the manifest, the release
          # package and the installer tests all look for <skill>/bin/<triple>/.
          # Built natively here; the native job builds and exercises the
          # cross/static artifacts for release.
          cargo build --release --manifest-path src/bug-report/Cargo.toml
          cargo build --release --manifest-path src/todo/Cargo.toml
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64|Linux:amd64) dir=x86_64-unknown-linux-musl ;;
            Linux:aarch64|Linux:arm64) dir=aarch64-unknown-linux-musl ;;
            Darwin:x86_64) dir=x86_64-apple-darwin ;;
            Darwin:arm64) dir=aarch64-apple-darwin ;;
            MINGW*:x86_64|MSYS*:x86_64|CYGWIN*:x86_64|Windows*:x86_64) dir=x86_64-pc-windows-msvc ;;
            *) echo "::error::unsupported host for the register binaries: $(uname -s):$(uname -m)"; exit 1 ;;
          esac
          mkdir -p "bug-report/bin/$dir" "todo/bin/$dir"
          cp "$GITHUB_WORKSPACE/target/release/bugs" "bug-report/bin/$dir/bugs"
          cp "$GITHUB_WORKSPACE/target/release/todo" "todo/bin/$dir/todo"

      - name: Place the compiled plan-crypt rung so its assertions run
        # Without it test-plan-crypt.sh and test-sha256-fallbacks.sh SKIP their
        # compiled branch loudly and check only the shell rungs, which is the
        # half that already ran everywhere.
        if: runner.os == 'Linux'
        run: |
          cargo build --release --manifest-path src/plan-crypt/Cargo.toml
          mkdir -p planning/.ci-bin
          cp "$GITHUB_WORKSPACE/target/release/plan-crypt" planning/.ci-bin/plan-crypt
          echo "PLAN_CRYPT_BIN=$PWD/planning/.ci-bin/plan-crypt" >> "$GITHUB_ENV"

      - name: Build tony-the-pony, which classifies code against prose
        # test-portability-contract.sh redacts comments, strings and heredoc
        # bodies through this binary before applying a rule, so without it the
        # construct scan would read prose as code. The test builds it when it is
        # missing; building here keeps that off the suite's clock.
        run: cargo build --release --manifest-path src/tony-the-pony/Cargo.toml

      - name: Build every compiled helper into bin/<triple> (T116)
        # The shell suite drives compiled binaries, not bash bodies: every
        # planning/scripts/*.sh execs its crate's binary through
        # plan_exec_compiled_binary_if_present, which finds it only under
        # bin/<host triple> (or AI_SKILLS_BIN_ROOT), and run-tests.sh itself
        # is one of them. Two things used to be missing here and every shard
        # died at the top of run-tests.sh with exit 69:
        #
        #   - planning/scripts/plan-core-lib.sh is generated (by
        #     build-plan-libs.sh) and gitignored, so a fresh checkout has none
        #     and the wiring cannot even be sourced;
        #   - the only binary staged was run-tests, under a scratch
        #     AI_SKILLS_BIN_ROOT, so every OTHER script the suite ran found no
        #     binary either.
        #
        # setup-dev-env.sh is the one place that knows the crate list, the
        # host triple, and the generated-library bootstrap, so this runs it
        # rather than keeping a second list here that drifts.
        # SETUP_DEV_ENV_IN_NIX=1 skips its nix entry: the toolchain is the
        # rust-toolchain step above, pinned to the same version.
        run: |
          SETUP_DEV_ENV_IN_NIX=1 ./setup-dev-env.sh
          # Pin the suite to the directory just built (plan_bin_dir tier 1).
          # Left to itself the lookup prefers ~/.config/tsch-ai-skills/bin
          # whenever that directory exists, and the suite's own installer
          # tests create it holding only bugs and todo -- after which every
          # later wrapper finds no binary and exits 69.
          triple="$(./setup-dev-env.sh --list | sed -n 's/^host target: //p')"
          [ -n "$triple" ] || { echo "::error::setup-dev-env.sh --list named no host target"; exit 1; }
          echo "AI_SKILLS_BIN_ROOT=$PWD/bin/$triple" >> "$GITHUB_ENV"
          # Dependency objects (deps/, build/, .fingerprint/) are nearly the
          # whole of target/ and were never needed past this point. Freeing
          # them is what a disk-tight runner needs: an earlier version of this
          # job hit 99% disk usage with 1.3G free before this reclaim existed.
          du -sh target 2>/dev/null || true
          rm -rf target/release/deps target/release/build target/release/incremental target/release/.fingerprint
          rm -rf target/*/release/deps target/*/release/build target/*/release/incremental target/*/release/.fingerprint
          df -h . 2>/dev/null || true

      - name: Write the selected test list (T116)
        if: needs.scope.outputs.tests_scope == 'selective'
        run: printf '%s\n' '${{ needs.scope.outputs.tests }}' | tr ' ' '\n' > selected-tests.txt

      - name: Run this shard of the deterministic test suite
        run: |
          select_flag=()
          [ '${{ needs.scope.outputs.tests_scope }}' != 'selective' ] \
              || select_flag=(--select-file selected-tests.txt)
          ./run-tests.sh "${select_flag[@]}" --shard "${{ matrix.shard }}/$SHARD_TOTAL"

      - name: Verify no temp files leaked outside the runner's scope
        run: |
          # run-tests.sh stages its scratch root under ${TMPDIR:-/tmp}. On the
          # macOS runner TMPDIR is a per-session /var/folders/... directory and
          # /tmp is a symlink to /private/tmp, which BSD find refuses to descend
          # unless -H is given; scan both. -maxdepth, -name and -o behave the
          # same on GNU and BSD find.
          scans="${TMPDIR:-/tmp}"
          [ "$scans" = "/tmp" ] || scans="$scans /tmp"
          leftovers=0
          for scan in $scans; do
            [ -d "$scan" ] || continue
            found="$(find -H "$scan" -maxdepth 1 \( -name 'ai-skills-tests.*' -o -name 'planning-agent' -o -name 't.?????' \) 2>/dev/null)"
            [ -n "$found" ] || continue
            printf '%s\n' "$found"
            leftovers=$((leftovers + $(printf '%s\n' "$found" | wc -l)))
          done
          echo "leftover temp roots: $leftovers"
          if [ "$leftovers" -ne 0 ]; then
            echo "::error::run-tests.sh left temp files behind"
            exit 1
          fi

  test-bash32:
    # Proves: the suite runs on the bash 3.2 floor that CODE-STYLE.md section 1
    # declares. A separate leg is needed because `#!/usr/bin/env bash` on a
    # macOS runner can resolve to a newer Homebrew bash, which hides every
    # bash-4-only construct.
    name: Test suite passes on macOS system bash 3.2 (portability floor, shard ${{ matrix.shard }})
    runs-on: macos-latest
    # T116: same reason as the leg above.
    needs: scope
    # Same backstop as the leg above, and this is the leg that caught the hang
    # first, because a timing difference on the 3.2 floor lost a race the
    # other shells won.
    timeout-minutes: 45
    # See the "test" job's own comment on SHARD_TOTAL: kept equal to this
    # array's length by hand, in the same small diff, on purpose.
    env:
      SHARD_TOTAL: 4
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Same reason as the leg above: the suite includes history-dependent
          # assertions that a shallow checkout cannot satisfy.
          fetch-depth: 0

      - name: Put /bin first on PATH so bash resolves to system bash 3.2
        run: echo "/bin" >> "$GITHUB_PATH"

      - name: Build and expose the native rjq test binary
        uses: dtolnay/rust-toolchain@1.98

      - name: Add bundled rjq to PATH for the bash 3.2 suite
        shell: bash
        run: |
          case "$(uname -m)" in
            x86_64) target=x86_64-apple-darwin ;;
            arm64|aarch64) target=aarch64-apple-darwin ;;
            *) echo "::error::unsupported macOS host: $(uname -m)"; exit 1 ;;
          esac
          rustup target add "$target"
          cargo build --release --manifest-path src/rjq/Cargo.toml --target "$target"
          mkdir -p "planning/bin/$target"
          cp "${{ github.workspace }}/target/$target/release/rjq" "planning/bin/$target/rjq"
          echo "$PWD/planning/bin/$target" >> "$GITHUB_PATH"

      - name: Record the bash under test (must be 3.2.x)
        run: |
          command -v bash
          bash --version
          /bin/bash --version

      - name: Put GNU coreutils first on the macOS runner
        # The suite's date, stat and readlink expectations are the GNU ones. BSD
        # userland is a supported target (CODE-STYLE.md section 1) and is covered
        # by the bash 3.2 floor leg; this leg tests the default shell, not the
        # default userland.
        run: |
          if command -v brew >/dev/null 2>&1; then
            brew install coreutils
            echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          fi

      - name: Install GNU nano, because macOS answers `nano` with Pico
        # cargo test -p interactive-shell --test pty_orchestration (T145 goal
        # 25; formerly the bash test-interactive-shell.sh) drives GNU nano's
        # own bindings -- META-RIGHT, CTRL-E, CTRL-O -- to prove the PTY
        # wrapper can operate a full-screen program. Stock macOS ships UW Pico
        # under that name (the runner reported "UW PICO 5.09" in its title
        # bar), which shares neither the title nor the keys, so the test
        # skips itself there rather than asserting against a different
        # program.
        #
        # Installing it keeps the assertions strict instead of widening them to
        # cover two editors: the subject is the wrapper, so pinning the program
        # removes a variable rather than adding a branch. This is the same
        # reasoning as the GNU coreutils step above.
        if: runner.os == 'macOS'
        run: |
          brew install nano
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install memlimit, so the resource wrapper's RAM cap is real where it can be
        # limited-run.sh caps memory with a transient systemd scope on Linux and
        # with memlimit on macOS. Without it the suite prints "the requested RAM
        # limit (2G) is not enforced" and runs UNCAPPED, so a test that eats
        # memory takes the runner down instead of failing inside its budget.
        #
        # NEITHER macOS ARCH CAN ENFORCE IT ON THESE RUNNERS, measured
        # 2026-09-04 and written up in .agents/knowledge/github-ci-runners.md.
        # Intel: memlimit publishes only memlimit-aarch64-apple-darwin, so there
        # is nothing to install. arm64: it installs and then cannot run, because
        # it works through DYLD_INSERT_LIBRARIES, which SIP strips for system
        # binaries -- its own installer says "no non-SIP shell found" -- and its
        # hook library is arm64 where the system is arm64e:
        #
        #   dyld: terminating because inserted dylib '.../hook-*.dylib' could
        #   not be loaded: (mach-o file, but is an incompatible architecture
        #   (have 'arm64', need 'arm64e'))
        #
        # So the probe's failure is a PLATFORM RESTRICTION, not a broken step,
        # and it reports `::notice` rather than failing the leg. A hard failure
        # here reddens every macOS run for something no change to this
        # repository can fix. What is still worth doing is installing it and
        # SAYING which of the two states we are in, so "uncapped" is a recorded
        # fact rather than a silence.
        #
        # MEMLIMIT_UNMANAGED_INSTALL pins the directory and switches off both
        # the installer's PATH editing and its self-updater, so the directory
        # added to PATH is provably the one installed into.
        if: runner.os == 'macOS'
        run: |
          if [ "$(uname -m)" != arm64 ]; then
            echo "::notice::memlimit is Apple Silicon only; $(uname -m) has no memory-cap mechanism, so the suite runs uncapped"
            exit 0
          fi
          root="$HOME/.local/memlimit"
          export MEMLIMIT_UNMANAGED_INSTALL="$root"
          curl -LsSf https://github.com/pingiun/memlimit/releases/latest/download/memlimit-installer.sh | sh
          bin=""
          for candidate in "$root/memlimit" "$root/bin/memlimit"; do
            if [ -x "$candidate" ]; then bin="$candidate"; break; fi
          done
          if [ -z "$bin" ]; then
            echo "::notice::memlimit did not install under $root; the suite runs uncapped"
            ls -lR "$root" || true
            exit 0
          fi
          if ! "$bin" 2147483648 -- /usr/bin/true; then
            echo "::notice::$bin installed but cannot cap a command on this runner (SIP strips DYLD_INSERT_LIBRARIES); the suite runs uncapped"
            exit 0
          fi
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
          echo "memlimit ready at $bin"

      - name: Place the compiled register rungs
        # Same reason as the default-bash leg: skill_files() lists the host's
        # <skill>/bin/<triple>/ row, so without these six tests go red on a tree
        # that is green everywhere else. This leg has its own steps, which is why
        # adding the step to the other job did not cover it.
        run: |
          cargo build --release --manifest-path src/bug-report/Cargo.toml
          cargo build --release --manifest-path src/todo/Cargo.toml
          case "$(uname -s):$(uname -m)" in
            Darwin:x86_64) dir=x86_64-apple-darwin ;;
            Darwin:arm64) dir=aarch64-apple-darwin ;;
            *) echo "::error::unexpected host for the bash 3.2 leg: $(uname -s):$(uname -m)"; exit 1 ;;
          esac
          mkdir -p "bug-report/bin/$dir" "todo/bin/$dir"
          cp "$GITHUB_WORKSPACE/target/release/bugs" "bug-report/bin/$dir/bugs"
          cp "$GITHUB_WORKSPACE/target/release/todo" "todo/bin/$dir/todo"

      - name: Build tony-the-pony, which classifies code against prose
        # Its own step on this leg for the same reason the register binaries
        # have one: a build in the other job does not reach this runner.
        run: cargo build --release --manifest-path src/tony-the-pony/Cargo.toml

      - name: Build every compiled helper into bin/<triple> (T116)
        # See the sibling step of the same name on the default-bash leg for
        # why the shell suite needs every compiled helper staged before it
        # runs, and why the wiring cannot start without the generated
        # plan-core-lib.sh (setup-dev-env.sh builds that too, through
        # build-plan-libs.sh's own fresh-checkout bootstrap).
        run: |
          SETUP_DEV_ENV_IN_NIX=1 ./setup-dev-env.sh
          # Pin the suite to the directory just built (plan_bin_dir tier 1).
          # Left to itself the lookup prefers ~/.config/tsch-ai-skills/bin
          # whenever that directory exists, and the suite's own installer
          # tests create it holding only bugs and todo -- after which every
          # later wrapper finds no binary and exits 69.
          triple="$(./setup-dev-env.sh --list | sed -n 's/^host target: //p')"
          [ -n "$triple" ] || { echo "::error::setup-dev-env.sh --list named no host target"; exit 1; }
          echo "AI_SKILLS_BIN_ROOT=$PWD/bin/$triple" >> "$GITHUB_ENV"
          # Dependency objects are nearly all of target/ and were never
          # needed past this point; freeing them is what a disk-tight runner
          # needs.
          du -sh target 2>/dev/null || true
          rm -rf target/release/deps target/release/build target/release/incremental target/release/.fingerprint
          rm -rf target/*/release/deps target/*/release/build target/*/release/incremental target/*/release/.fingerprint
          df -h . 2>/dev/null || true

      - name: Write the selected test list (T116)
        if: needs.scope.outputs.tests_scope == 'selective'
        run: printf '%s\n' '${{ needs.scope.outputs.tests }}' | tr ' ' '\n' > selected-tests.txt

      - name: Run this shard of the deterministic test suite under /bin/bash
        run: |
          select_flag=()
          [ '${{ needs.scope.outputs.tests_scope }}' != 'selective' ] \
              || select_flag=(--select-file selected-tests.txt)
          /bin/bash ./run-tests.sh "${select_flag[@]}" --shard "${{ matrix.shard }}/$SHARD_TOTAL"

      - name: Verify no temp files leaked outside the runner's scope
        run: |
          scans="${TMPDIR:-/tmp}"
          [ "$scans" = "/tmp" ] || scans="$scans /tmp"
          leftovers=0
          for scan in $scans; do
            [ -d "$scan" ] || continue
            found="$(find -H "$scan" -maxdepth 1 \( -name 'ai-skills-tests.*' -o -name 'planning-agent' -o -name 't.?????' \) 2>/dev/null)"
            [ -n "$found" ] || continue
            printf '%s\n' "$found"
            leftovers=$((leftovers + $(printf '%s\n' "$found" | wc -l)))
          done
          echo "leftover temp roots: $leftovers"
          if [ "$leftovers" -ne 0 ]; then
            echo "::error::run-tests.sh left temp files behind"
            exit 1
          fi

  # The former macos-known-failures job is gone (T37): its blocker list is
  # fully cleared -- items 1-7 are enforced by tests, and blocker 8 was closed
  # by two consecutive green macOS runs (32474258670, 32476867183) -- so both
  # macOS legs above are now blocking.

  test-windows:
    # Proves: the deterministic shell suite passes on Windows under Git for
    # Windows' bash. The `native` job's windows leg proves the Rust crates
    # build and pass there; this proves the bash skills and their tests do too,
    # which is the half of the product a cargo run never touches.
    #
    # Sharded like the other suite jobs, and it takes the same selective test
    # list from the scope job.
    name: Test suite passes on windows-latest (Git bash, shard ${{ matrix.shard }})
    runs-on: windows-latest
    needs: scope
    timeout-minutes: 60
    # SHARD_TOTAL must equal the length of the shard array below, for the
    # reason spelled out on the `test` job.
    env:
      SHARD_TOTAL: 4
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      # Before the checkout: the runner's git converts to CRLF by default, and
      # a bash script with CRLF endings fails on its first line.
      - name: Check out with LF endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # benchmark/results holds paths past what Windows can check out.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/benchmark/results/

      - name: Pin the toolchain
        uses: dtolnay/rust-toolchain@1.98
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      # Without this, `bash` resolves to System32's WSL launcher, which is not
      # the shell the scripts are written for; Git's coreutils come first for
      # the same reason (find, sort and friends, not their Windows namesakes).
      - name: Put Git for Windows' bash and coreutils first on PATH
        shell: bash
        run: |
          {
            echo 'C:\Program Files\Git\bin'
            echo 'C:\Program Files\Git\usr\bin'
          } >> "$GITHUB_PATH"

      - name: Build every compiled helper into bin/<triple>
        shell: bash
        run: |
          SETUP_DEV_ENV_IN_NIX=1 ./setup-dev-env.sh
          triple="$(./setup-dev-env.sh --list | sed -n 's/^host target: //p')"
          [ -n "$triple" ] || { echo "::error::setup-dev-env.sh --list named no host target"; exit 1; }
          echo "AI_SKILLS_BIN_ROOT=$PWD/bin/$triple" >> "$GITHUB_ENV"

      - name: Write the selected test list (T116)
        if: needs.scope.outputs.tests_scope == 'selective'
        shell: bash
        run: printf '%s\n' '${{ needs.scope.outputs.tests }}' | tr ' ' '\n' > selected-tests.txt

      - name: Run this shard of the deterministic test suite
        shell: bash
        run: |
          set -o pipefail
          select_flag=()
          [ '${{ needs.scope.outputs.tests_scope }}' != 'selective' ] \
              || select_flag=(--select-file selected-tests.txt)
          ./run-tests.sh "${select_flag[@]}" --shard "${{ matrix.shard }}/$SHARD_TOTAL" 2>&1 \
              | tee windows-shell-suite.log

      - name: Keep the suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-shell-suite-log-shard-${{ matrix.shard }}
          path: windows-shell-suite.log
          if-no-files-found: ignore

  test-suite-ok:
    # T116: `test`, `test-bash32` and `test-windows` are each sharded (2 os * 4
    # shards, plus 4 more for the bash-3.2 leg and 4 for Windows), so their own
    # check names carry a shard number and change if SHARD_TOTAL ever does.
    # Branch protection needs ONE stable name to require regardless of shard
    # count, which is this job's only reason to exist -- it proves nothing
    # itself, it only reports whether every shard of all three jobs actually
    # passed.
    #
    # `if: always()` is required for a job whose own dependencies might fail:
    # GitHub skips a job's default `if` (`success()`) the moment any `needs`
    # entry fails, and a SKIPPED required check does not block a merge the way
    # a FAILED one does -- exactly the silent-pass this job exists to prevent.
    name: Shell test suite (all shards) passes
    runs-on: ubuntu-latest
    needs: [test, test-bash32, test-windows]
    if: always()
    steps:
      - name: Check every shard succeeded
        run: |
          if [ '${{ needs.test.result }}' != 'success' ] \
              || [ '${{ needs['test-bash32'].result }}' != 'success' ] \
              || [ '${{ needs['test-windows'].result }}' != 'success' ]; then
            echo "::error::one or more test-suite shards did not succeed (test: ${{ needs.test.result }}, test-bash32: ${{ needs['test-bash32'].result }}, test-windows: ${{ needs['test-windows'].result }})"
            exit 1
          fi

  scope:
    # Proves: nothing, except that the selector scripts below run compiled
    # rather than bash (see the build step ahead of "Decide the scope"). This
    # job DECIDES, and the decision is what the native legs below obey. It is
    # otherwise deliberately tiny and always runs, because every other crate
    # job depends on its answer.
    #
    # The default is always the widest scope. See .github/ci-scope.sh — every
    # error path returns full, including no merge base, a shallow clone and
    # cargo metadata failing. A selector that narrows when it is confused turns
    # a green tick into "we did not look" while it reads as "we looked".
    name: Decide how much of the workspace this run must build
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.decide.outputs.scope }}
      reason: ${{ steps.decide.outputs.reason }}
      crates: ${{ steps.decide.outputs.crates }}
      rjq: ${{ steps.subjects.outputs.rjq }}
      chat: ${{ steps.subjects.outputs.chat }}
      plan_crypt: ${{ steps.subjects.outputs.plan_crypt }}
      planning_commands: ${{ steps.subjects.outputs.planning_commands }}
      editor: ${{ steps.subjects.outputs.editor }}
      installer: ${{ steps.subjects.outputs.installer }}
      tests_scope: ${{ steps.decide_tests.outputs.scope }}
      tests: ${{ steps.decide_tests.outputs.tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # The selector needs a merge base, so it needs history. A shallow
          # clone makes it return full, which is safe but defeats the point.
          fetch-depth: 0

      - name: Pin the toolchain
        # cargo metadata supplies the reverse-dependency graph, so the selector
        # needs cargo even though it builds nothing.
        uses: dtolnay/rust-toolchain@1.98

      - name: Build and stage the compiled selector binaries
        # ci-scope.sh, ci-subjects.sh and ci-test-scope.sh each prefer their
        # own compiled binary over their bash body via
        # plan_exec_compiled_binary_if_present (T145 goals 20-22), which finds
        # it via plan_bin_dir's own upward walk for a bin/<triple> directory --
        # anchored at plan-crypt-lib.sh's own location (planning/scripts/,
        # BASH_SOURCE[0] inside a function resolves to where it was defined,
        # not where it was called from), not at the caller's own directory, so
        # the outermost bin/<triple> found walking up from there is what
        # every caller in this repository shares: this checkout's own
        # repo-root bin/<triple>. plan_crypt_target_triple's own answer for a
        # Linux x86_64 runner is unconditionally x86_64-unknown-linux-musl
        # (plan-crypt-lib.sh), not whatever the host toolchain happens to
        # build for. Without this step
        # no compiled binary exists yet this early in a real run, so all three
        # scripts below would always fall through to bash -- the wiring these
        # three goals added would be proven only by their own local test
        # harnesses and dead code in every actual CI run.
        shell: bash
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y -qq musl-tools
          cargo build --release --target x86_64-unknown-linux-musl \
            -p ci-scope -p ci-subjects -p ci-test-scope
          mkdir -p bin/x86_64-unknown-linux-musl
          for bin in ci-scope ci-subjects ci-test-scope; do
            cp "target/x86_64-unknown-linux-musl/release/$bin" "bin/x86_64-unknown-linux-musl/$bin"
          done

      - name: Generate plan-core-lib.sh so the compiled-binary wiring can activate
        # plan_exec_compiled_binary_if_present (the wiring the step above
        # exists to feed) is reached only through
        # planning/scripts/plan-core-lib.sh, which is GENERATED (by
        # build-plan-libs.sh) and gitignored -- it does not exist on a fresh
        # checkout like this job's own, so without this step every one of
        # ci-scope.sh/ci-subjects.sh/ci-test-scope.sh's own `if [ -f
        # .../plan-core-lib.sh ]` guards is false and all three silently fall
        # all the way through to their bash bodies, staged binaries above or
        # not. Bash's own body then needs `rjq` on PATH (only the bash
        # implementation parses `cargo metadata` output that way; the
        # compiled binaries use serde_json natively and never call rjq at
        # all) -- and nothing in this job builds or stages rjq either, so
        # that fallback fails too. Running this now is what makes the step
        # above actually reachable, instead of the compiled binaries sitting
        # in bin/x86_64-unknown-linux-musl unused.
        shell: bash
        run: ./planning/scripts/build-plan-libs.sh

      - name: Decide the scope
        id: decide
        shell: bash
        run: |
          # A PUSH TO A LONG-LIVED BRANCH IS ALWAYS FULL, and not by preference:
          # on a push to master, HEAD *is* origin/master, so the merge base is
          # HEAD, the diff is empty, and the selector correctly reported
          # `scope=none` -- skipping every native leg and turning master green
          # having compiled nothing. A tick that means "we did not look" is the
          # one outcome this whole mechanism exists to prevent, so the branch
          # that cannot compute a meaningful base does not get to narrow.
          #
          # It is also what this workflow's own `on:` comment already promised:
          # "Pushes to either run the full matrix."
          #
          # Selection is therefore a PULL REQUEST feature. That is where it
          # pays anyway -- pull requests are the frequent, incremental runs --
          # and it keeps the integration branches exhaustively covered.
          if [ -z "${{ github.base_ref }}" ]; then
            .github/ci-scope.sh --push-to "${{ github.ref_name }}"
          else
            .github/ci-scope.sh --base "origin/${{ github.base_ref }}"
          fi

      - name: Map the crates onto build subjects
        id: subjects
        shell: bash
        run: |
          .github/ci-subjects.sh \
            --scope '${{ steps.decide.outputs.scope }}' \
            --crates '${{ steps.decide.outputs.crates }}'

      - name: Decide which shell tests and crates run (T116)
        id: decide_tests
        shell: bash
        run: |
          # Same push-vs-pull-request reasoning as "Decide the scope" above:
          # an integration branch's diff against itself is empty, so it must
          # not be read as "nothing changed" here either.
          if [ -z "${{ github.base_ref }}" ]; then
            .github/ci-test-scope.sh --push-to "${{ github.ref_name }}"
          else
            .github/ci-test-scope.sh --base "origin/${{ github.base_ref }}"
          fi

      - name: Say what was decided, in the run summary
        shell: bash
        run: |
          {
            printf '## CI scope: `%s`\n\n' '${{ steps.decide.outputs.scope }}'
            printf '%s\n\n' '${{ steps.decide.outputs.reason }}'
            printf '| subject | built |\n|---|---|\n'
            printf '| rjq | %s |\n' '${{ steps.subjects.outputs.rjq }}'
            printf '| chat | %s |\n' '${{ steps.subjects.outputs.chat }}'
            printf '| plan-crypt | %s |\n' '${{ steps.subjects.outputs.plan_crypt }}'
            printf '| planning commands | %s |\n' '${{ steps.subjects.outputs.planning_commands }}'
            printf '| ai-text-editor | %s |\n' '${{ steps.subjects.outputs.editor }}'
            printf '| installer | %s |\n' '${{ steps.subjects.outputs.installer }}'
            crates='${{ steps.decide.outputs.crates }}'
            if [ -n "$crates" ]; then
              printf '\nCrates in scope, with their dependents:\n\n'
              printf '%s\n' "$crates" | tr ' ' '\n' | sed 's/^/- `/; s/$/`/'
            fi
            printf '\n## Test suite scope: `%s`\n\n' '${{ steps.decide_tests.outputs.scope }}'
            printf '%s\n' '${{ steps.decide_tests.outputs.reason }}'
          } >> "$GITHUB_STEP_SUMMARY"

  native:
    # Proves: every subject in scope builds, and its binaries actually launch,
    # on each supported platform's own native runner.
    #
    # ONE JOB PER PLATFORM, NOT PER SUBJECT. This replaced four separate matrix
    # jobs (plan-crypt, chat-binary, rjq-binary, planning-command-binary) that
    # each fanned out over the same five os/target pairs: twenty jobs where five
    # will do. Every one of those twenty paid its own checkout, toolchain
    # install and target install, and three of them re-ran a workspace-wide
    # clippy and test that the fourth had already run.
    #
    # The platforms are NOT consolidated, only the subjects. Each leg still runs
    # on the host whose target it builds, because these binaries are verified by
    # being EXECUTED (`--help`, a real query, a linkage check). A cross-build
    # that cannot launch must not be mistaken for platform coverage, and only a
    # native runner can tell the difference.
    name: ${{ matrix.target }} builds and runs every subject in scope
    runs-on: ${{ matrix.os }}
    needs: scope
    # scope=none means the selector established that no crate changed. The
    # shell, packaging and suite gates still run; there is simply nothing to
    # compile.
    if: needs.scope.outputs.scope != 'none'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      # Windows only, and before checkout so it applies to it: Git for
      # Windows otherwise writes CRLF into every shell script it checks out.
      # .gitattributes pins the same thing for a developer's own clone.
      - name: Check out with LF endings
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Everything EXCEPT benchmark/results. The union of what the
          # workspace's tests read from the tree keeps growing: the real-tree
          # parity tests (blast-radius, verify-both-shells,
          # generate-portability, ci-scope, ci-subjects, ci-test-scope) run
          # the real .github/*.sh and planning/scripts, and
          # test-mermaid-accuracy checks the tracked documents and every
          # script and artifact their diagrams name. A hand-kept include list
          # had to equal that union and failed the mermaid test without
          # anything pointing at the list, so this excludes the one directory
          # nothing reads instead: its archived runs hold paths longer than
          # Windows allows, and checking them out failed the Windows leg.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/benchmark/results/

      # `bash` on a windows-latest PATH can resolve to C:\Windows\System32\
      # bash.exe, the WSL launcher, which fails when no distro is installed.
      # Git for Windows' own bash goes first, with the GNU tools beside it.
      - name: Put Git for Windows' bash and coreutils first on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: |
          {
            echo 'C:\Program Files\Git\bin'
            echo 'C:\Program Files\Git\usr\bin'
          } >> "$GITHUB_PATH"

      - name: Pin the toolchain and target
        uses: dtolnay/rust-toolchain@1.98
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install the target standard library
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - name: Install the musl C toolchain
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get install -y -qq musl-tools

      - name: Build rjq and put it on PATH for the workspace test step below
        # At least one confirmed, still-live consumer needs this: generate-portability's
        # own real-tree-parity test (src/generate-portability/tests/generate_portability_flow.rs,
        # matches_the_real_bash_original_against_the_real_repository_tree) genuinely
        # shells out to the real generate-portability.sh, which itself
        # unconditionally requires rjq on PATH (`command -v rjq >/dev/null 2>&1
        # || exit 69`) before doing anything else -- independent of ci-scope.sh,
        # whose own bash body (rjq's original, only-known reason here) is gone
        # as of goal 24. Not claimed exhaustive: two prior attempts to
        # enumerate every consumer of this step were each found wrong by a
        # fresh review, so this cites one confirmed reason rather than
        # asserting there are no others. `cargo test --workspace` DOES compile
        # rjq's own binary as a side effect (every workspace member's [[bin]]
        # targets are built), but never onto PATH, so a nested
        # `Command::new("bash")` subprocess inside a test cannot find it --
        # observed as a deterministic, real-CI-only failure on every
        # non-Windows leg before this step existed. The later "Build rjq and
        # prove it answers a query" step below only runs when rjq itself is in
        # this run's scope, which is not the same condition: the
        # workspace-wide test step runs on every leg regardless of scope, so
        # rjq needs to be ready before it, unconditionally.
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p rjq --target "${{ matrix.target }}"
          echo "$GITHUB_WORKSPACE/target/${{ matrix.target }}/debug" >> "$GITHUB_PATH"

      # ---- one workspace-wide gate, not one per subject -------------------
      # fmt, clippy and test cover every member of the workspace in a single
      # pass. The per-subject steps below therefore only BUILD and EXECUTE;
      # they do not re-lint or re-test what this step already covered.
      #
      # This runs whenever anything is in scope. Narrowing it per crate was
      # considered and rejected: clippy and test are cheap next to the release
      # builds, and a workspace-wide pass is what catches a library change
      # breaking a consumer that selection failed to name.
      #
      # interactive-shell now builds and tests on every leg, Windows included
      # (T84): windows.rs implements the same Backend/Transport/Listener
      # traits goal 1 extracted, using ConPTY/Job Objects and a loopback TCP
      # transport (mirroring ai-text-editor's own pattern) in place of
      # openpty/ioctl/setsid/kill and the Unix socket. tests/protocol.rs is
      # cfg(unix)-gated (its own transport is Unix-socket-specific), so
      # --workspace's test run is meaningful on every target unmodified.
      - name: Generate plan-core-lib.sh for the real-tree parity tests
        # ci-scope, ci-subjects, ci-test-scope and generate-postmortem each run
        # their real .github/*.sh or planning/scripts/*.sh wrapper and compare
        # it with the compiled binary. A wrapper reaches the binary through
        # planning/scripts/plan-core-lib.sh, which is generated and gitignored,
        # so on a fresh checkout it answers "binary not found" and the
        # comparison fails for a reason that has nothing to do with the crate.
        shell: bash
        run: ./planning/scripts/build-plan-libs.sh

      - name: Format, lint and test the whole workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --target "${{ matrix.target }}" -- -D warnings
          # --no-fail-fast: one failing test binary used to hide every crate
          # after it, so a leg needed one run per failure to list them all.
          cargo test --workspace --all-targets --no-fail-fast --target "${{ matrix.target }}"

      # ---- rjq -------------------------------------------------------------
      - name: Build rjq and prove it answers a query
        if: needs.scope.outputs.rjq == 'true'
        shell: bash
        working-directory: src/rjq
        run: |
          set -euo pipefail
          cargo build --release --target "${{ matrix.target }}"
          bin="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/rjq"
          [ -x "$bin" ] || bin="$bin.exe"
          output="$(printf '{"a":1}' | "$bin" '.a')"
          [ "$output" = "1" ] || { echo "::error::rjq output was $output"; exit 1; }

      - name: Stage and upload the rjq artifact
        if: needs.scope.outputs.rjq == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "rjq-artifacts/${{ matrix.target }}"
          release="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release"
          if [ -f "$release/rjq" ]; then
            cp "$release/rjq" "rjq-artifacts/${{ matrix.target }}/rjq"
          else
            cp "$release/rjq.exe" "rjq-artifacts/${{ matrix.target }}/rjq.exe"
          fi

      - name: Upload the rjq artifact
        if: needs.scope.outputs.rjq == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rjq-${{ matrix.target }}
          path: rjq-artifacts
          if-no-files-found: error

      # ---- ai-text-editor --------------------------------------------------
      # Folded in from .github/workflows/ai-text-editor-artifacts.yml, which
      # ran its own four-platform matrix on a `push` path filter and built
      # `--workspace --release` to get three binaries. It had no aarch64-linux
      # leg and pinned macos-13/macos-14 while this matrix had moved on, so
      # folding it in also stops the editor being built on runner images
      # nothing else uses.
      - name: Build the editor binaries
        if: needs.scope.outputs.editor == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for crate in ai-text-editor ai-text-editor-mcp; do
            manifest="src/$crate/Cargo.toml"
            [ -f "$manifest" ] || continue
            cargo build --manifest-path "$manifest" --release --target "${{ matrix.target }}"
          done

      - name: Upload the editor binaries
        if: needs.scope.outputs.editor == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ai-text-editor-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/ai-text-editor*
          if-no-files-found: warn

      # ---- chat ------------------------------------------------------------
      - name: Build the chat server, client, MCP adapter and spool watcher
        if: needs.scope.outputs.chat == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for crate in src/chat-server-rs src/chat-client-rs src/chat-mcp src/chat-spool-watch; do
            printf '==> %s\n' "$crate"
            cargo build --manifest-path "$crate/Cargo.toml" --release --target "${{ matrix.target }}"
          done

      - name: Upload the chat artifacts
        if: needs.scope.outputs.chat == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: chat-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/chat-server-rs
            target/${{ matrix.target }}/release/chat-server-rs.exe
            target/${{ matrix.target }}/release/chat-client-rs
            target/${{ matrix.target }}/release/chat-client-rs.exe
            target/${{ matrix.target }}/release/chat-mcp
            target/${{ matrix.target }}/release/chat-mcp.exe
            target/${{ matrix.target }}/release/chat-spool-watch
            target/${{ matrix.target }}/release/chat-spool-watch.exe
          if-no-files-found: error

      # ---- interactive-shell -----------------------------------------------
      # interactive-shell/binaries.tsv declares eight shipped rows -- the PTY
      # wrapper and the socket input client, for the two Linux and the two macOS
      # targets -- and until this step nothing built them. The registry is
      # allowed to name a binary that does not exist yet (tests/test-shipped-
      # binaries.sh says so), but a release assembles bin/<triple>/ from CI
      # artifacts, so eight declared rows with no producing job is a promise
      # that cannot be kept on any platform.
      #
      # No scope flag of its own: ci-subjects.sh maps crates onto subjects and
      # adding a fifteenth would be plumbing for a build that costs less than
      # the workspace-wide clippy already running above. The job-level
      # `scope != 'none'` condition is the gate.
      #
      # The fixture binary is deliberately not built: it is maintainer-only and
      # has no binaries.tsv row.
      - name: Build the interactive-shell binaries and prove they launch
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p interactive-shell --release --target "${{ matrix.target }}" \
            --bin interactive-shell --bin interactive-shell-input
          release="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release"
          for binary in interactive-shell interactive-shell-input; do
            bin="$release/$binary"
            [ -x "$bin" ] || bin="$bin.exe"
            # Executed, not just built: these are shipped as prebuilt artifacts,
            # so "it linked" is not the claim being made about them.
            "$bin" --help >/dev/null
            printf '%s launches on %s\n' "$binary" '${{ matrix.target }}'
          done

      - name: The musl interactive-shell build must actually be static
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          # Same claim as plan-crypt's: the target machine needs nothing.
          for binary in interactive-shell interactive-shell-input; do
            out="$(ldd "$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/$binary" 2>&1 || true)"
            printf '%s: %s\n' "$binary" "$out"
            case "$out" in
              *"not a dynamic executable"*|*"statically linked"*) ;;
              *) echo "::error::$binary links against a shared library"; exit 1 ;;
            esac
          done

      - name: Stage the interactive-shell artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "interactive-shell-artifacts/${{ matrix.target }}"
          release="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release"
          for binary in interactive-shell interactive-shell-input; do
            bin="$release/$binary"
            [ -x "$bin" ] || bin="$bin.exe"
            cp "$bin" "interactive-shell-artifacts/${{ matrix.target }}/$(basename "$bin")"
          done

      - name: Upload the interactive-shell artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: interactive-shell-${{ matrix.target }}
          path: interactive-shell-artifacts
          if-no-files-found: error

      # ---- installer ---------------------------------------------------------
      # The installer BINARY has no POSIX-only dependency of its own -- it is
      # cfg-gated on Unix only where that already has a working non-Unix
      # branch (install.rs/permissions.rs's executable-bit handling), and
      # installer_platform already resolves x86_64-pc-windows-msvc as a real
      # target. installer/bootstrap.sh, the curl-piped bash LAUNCHER around
      # this binary, is the actually POSIX-only piece -- but that is a
      # statement about bootstrap.sh, not about whether this binary builds,
      # runs, and answers --platform/--help correctly on Windows, which is
      # what this leg checks.
      # Verified by running it, not just linking it: --platform must answer
      # with this leg's own target, and a musl leg must actually BE static --
      # installer/build-installer-release.sh itself carries the comment for
      # why that check exists (a prior version of that script silently linked
      # glibc on a "matches the host" shortcut and labelled the result musl
      # regardless).
      - name: Build the installer binary and prove it launches
        if: needs.scope.outputs.installer == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p installer --target "${{ matrix.target }}"
          suffix=''
          case "${{ matrix.target }}" in *windows-msvc) suffix=.exe ;; esac
          bin="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/installer$suffix"
          reported="$("$bin" --platform)"
          [ "$reported" = "${{ matrix.target }}" ] \
            || { echo "::error::installer --platform said $reported, want ${{ matrix.target }}"; exit 1; }
          "$bin" --help >/dev/null

      - name: The musl installer build must actually be static
        if: needs.scope.outputs.installer == 'true' && contains(matrix.target, 'musl')
        shell: bash
        run: |
          out="$(ldd "$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/installer" 2>&1 || true)"
          printf '%s\n' "$out"
          case "$out" in
            *"not a dynamic executable"*|*"statically linked"*) ;;
            *) echo "::error::the musl build links against a shared library"; exit 1 ;;
          esac

      - name: Upload the installer artifact
        if: needs.scope.outputs.installer == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: installer-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/installer
            target/${{ matrix.target }}/release/installer.exe
          if-no-files-found: error

      # ---- plan-crypt ------------------------------------------------------
      - name: Build plan-crypt
        if: needs.scope.outputs.plan_crypt == 'true'
        shell: bash
        run: cargo build --manifest-path src/plan-crypt/Cargo.toml --release --target "${{ matrix.target }}"

      - name: Upload the plan-crypt artifact
        if: needs.scope.outputs.plan_crypt == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: plan-crypt-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/plan-crypt
            target/${{ matrix.target }}/release/plan-crypt.exe
          if-no-files-found: error

      - name: The musl plan-crypt build must actually be static
        if: needs.scope.outputs.plan_crypt == 'true' && contains(matrix.target, 'musl')
        shell: bash
        run: |
          # The whole distribution claim is that the target machine needs
          # nothing, so assert it rather than assume it. ldd prints either
          # "not a dynamic executable" or "statically linked" for a static-pie.
          out="$(ldd "$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/plan-crypt" 2>&1 || true)"
          printf '%s\n' "$out"
          case "$out" in
            *"not a dynamic executable"*|*"statically linked"*) ;;
            *) echo "::error::the musl build links against a shared library"; exit 1 ;;
          esac

      - name: Run plan-crypt and check it against this platform's own tool
        if: needs.scope.outputs.plan_crypt == 'true'
        shell: bash
        run: |
          # Run the artifact directly, never through `cargo run`: the claim is
          # about the binary, not about a toolchain being present.
          bin="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/plan-crypt"
          [ -x "$bin" ] || bin="$bin.exe"

          # The canonical NIST vector first, so a platform that disagrees is
          # named before anything else runs.
          got="$(printf 'abc' | "$bin" sha256)"
          want='ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad'
          [ "$got" = "$want" ] || { echo "::error::abc digest is $got, want $want"; exit 1; }

          # Then agreement with whatever digest tool this platform ships, which
          # is what lets a key minted by the shell chain keep verifying. macOS
          # has shasum and no sha256sum; the Windows runner's Git Bash has both.
          if command -v sha256sum >/dev/null 2>&1; then
            reference() { sha256sum | awk '{print $1}'; }
          else
            reference() { shasum -a 256 | awk '{print $1}'; }
          fi
          rc=0
          for n in 0 1 55 56 63 64 65 1000 70000; do
            input="$(awk -v n="$n" 'BEGIN { s = "x"; while (length(s) < n) s = s s; printf "%s", substr(s, 1, n) }')"
            a="$(printf '%s' "$input" | "$bin" sha256)"
            b="$(printf '%s' "$input" | reference)"
            if [ "$a" != "$b" ]; then
              echo "::error::$n bytes: plan-crypt $a, platform tool $b"
              rc=1
            fi
          done
          [ "$rc" -eq 0 ] || exit 1

          # And the CSPRNG answers on this platform: correct width, and two
          # draws that differ. On Windows this is the only place
          # BCryptGenRandom is ever executed.
          one="$("$bin" random-hex 8)"
          two="$("$bin" random-hex 8)"
          [ "${#one}" -eq 16 ] || { echo "::error::random-hex 8 gave ${#one} chars"; exit 1; }
          [ "$one" != "$two" ] || { echo "::error::two random draws were identical: $one"; exit 1; }
          printf 'digest and entropy agree on %s\n' '${{ matrix.target }}'

      # ---- planning commands ----------------------------------------------
      # The registry in planning/rust-migration.tsv is the source of truth for
      # which commands have been migrated. Each one is built and then RUN with
      # --help, because a command that builds but cannot launch on a platform
      # is not migrated on that platform.
      #
      # Only build and execute here: fmt, clippy and test for these crates were
      # already covered by the workspace-wide gate above, which is what the
      # predecessor job duplicated for every registered crate in turn.
      - name: Build and execute every registered planning command
        if: needs.scope.outputs.planning_commands == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "planning-rust-artifacts/${{ matrix.target }}"
          while IFS=$'\t' read -r path kind candidate note; do
            [ -n "$candidate" ] || continue
            case "$candidate" in
              render-plans-board)
                # The renderer is explicitly owned by another Rust migration.
                continue
                ;;
              overview-state)
                crate=plan-overview
                ;;
              *)
                crate="$candidate"
                ;;
            esac
            manifest="src/$crate/Cargo.toml"
            [ -f "$manifest" ] || { echo "::error::missing crate for $candidate: $manifest"; exit 1; }
            echo "==> $candidate ($crate)"
            cargo build --manifest-path "$manifest" --release --target "${{ matrix.target }}"
            suffix=''
            case "${{ matrix.target }}" in *windows-msvc) suffix=.exe ;; esac
            binary="target/${{ matrix.target }}/release/$crate$suffix"
            [ -x "$binary" ] || { echo "::error::missing release artifact: $binary"; exit 1; }
            output="planning-rust-artifacts/${{ matrix.target }}/$candidate$suffix"
            cp "$binary" "$output"
            chmod +x "$output"
            "$output" --help >/dev/null
          done < <({
            printf 'planning\truntime-binary\tplan-overview\tdeclared in planning/binaries.tsv\n'
            printf 'planning\truntime-binary\tregister-rebuild\tdeclared in planning/PACKAGE-MAP.tsv\n'
            awk -F '\t' '$2 == "runtime-binary" || $2 == "build-generator" || $2 == "dev-binary" { print }' planning/rust-migration.tsv
          } | LC_ALL=C sort -t "$(printf '\t')" -k3,3)

      - name: Upload the planning command artifacts
        if: needs.scope.outputs.planning_commands == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: planning-commands-${{ matrix.target }}
          path: planning-rust-artifacts
          if-no-files-found: error

      # The two register skills each ship one prebuilt binary, and both are
      # verified by being RUN against a real register on this platform rather
      # than by `--help`: the register is the repository's own memory, so a
      # writer that is subtly wrong on one platform corrupts the record instead
      # of failing loudly. That is why they are their own steps and not rows in
      # planning/rust-migration.tsv, whose loop derives the binary name from the
      # crate name and proves only that the command launches.
      #
      # Gated on planning_commands, the catch-all subject: ci-subjects.sh routes
      # every crate no named subject claims into it, and these two are among
      # them, so a change to either turns this on with no whitelist to keep.
      #
      # fmt, clippy and test are NOT repeated here. The workspace-wide gate
      # above covers both crates, which are members of the root workspace.
      - name: Build and exercise the bug-report register tools
        if: needs.scope.outputs.planning_commands == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path src/bug-report/Cargo.toml \
              --target "${{ matrix.target }}"
          bin="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/bugs"
          [ -f "$bin" ] || bin="$bin.exe"
          [ -f "$bin" ] || { echo "::error::no bugs artifact at $bin"; exit 1; }

          work="$(mktemp -d)"
          # The fixture's own skill_version must match whatever this binary
          # actually writes (src/bug-report/src/migrate.rs's SUPPORTED), or
          # the very first "$bin" check below refuses it as a stale version
          # -- read it from package.json rather than hardcoding it a third
          # time, so a future version bump cannot forget this one.
          version="$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -1)"
          # printf rather than a heredoc: a heredoc terminator cannot be
          # indented, and YAML block scalars indent every line.
          printf '{ "skill": "bug-report", "skill_version": "%s", "comment": "CI fixture.", "bugs": [] }\n' "$version" > "$work/reg.json"
          export BUGS_JSON="$work/reg.json"
          "$bin" check
          "$bin" add --title "a CI defect" --reproduce "run the leg" \
                     --observed "it was observed" --expected "it was expected" \
                     --severity major --priority high
          [ "$("$bin" count)" = 1 ] || { echo "::error::count was not 1"; exit 1; }
          [ "$("$bin" next-id)" = B2 ] || { echo "::error::next-id was not B2"; exit 1; }

          # A round trip has to be byte-identical: the register is a tracked
          # file, so a writer that reformats it produces a diff on every entry.
          # This is the assertion that lets the tool replace the shell writers.
          cp "$work/reg.json" "$work/reg.copy.json"
          "$bin" fmt >/dev/null
          cmp "$work/reg.json" "$work/reg.copy.json"

          # Closing without evidence must be refused: the register's whole value
          # is that a closure carries proof.
          if "$bin" update B1 --status fixed --fix "some commit"; then
            echo "::error::a closure with no verification was accepted"
            exit 1
          fi
          "$bin" update B1 --status fixed --fix "abc123 - the change" \
                          --verification "mutation-tested: reverted, saw it fail"
          "$bin" report | grep -q "0 open of 1 total"

          # An out-of-vocabulary severity must fail at parse, which is the point
          # of the types replacing a validation pass.
          sed 's/"major"/"critical"/' "$work/reg.json" > "$work/bad.json"
          if BUGS_JSON="$work/bad.json" "$bin" check; then
            echo "::error::an out-of-enum severity was accepted"
            exit 1
          fi

      - name: Build and exercise the todo queue tools
        if: needs.scope.outputs.planning_commands == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path src/todo/Cargo.toml \
              --target "${{ matrix.target }}"
          bin="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/todo"
          [ -f "$bin" ] || bin="$bin.exe"
          [ -f "$bin" ] || { echo "::error::no todo artifact at $bin"; exit 1; }

          work="$(mktemp -d)"
          # See the bug-report leg above for why this is read rather than
          # hardcoded: it must match src/todo/src/migrate.rs's SUPPORTED.
          version="$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -1)"
          printf '{ "skill": "todo", "skill_version": "%s", "comment": "CI fixture.", "tasks": [] }\n' "$version" > "$work/queue.json"
          export TODO_JSON="$work/queue.json"
          "$bin" check
          "$bin" add --title "a CI task" --detail "run the leg" --priority high
          [ "$("$bin" count)" = 1 ] || { echo "::error::count was not 1"; exit 1; }
          [ "$("$bin" next-id)" = T2 ] || { echo "::error::next-id was not T2"; exit 1; }

          cp "$work/queue.json" "$work/queue.copy.json"
          "$bin" fmt >/dev/null
          cmp "$work/queue.json" "$work/queue.copy.json"

          # Closing without evidence must be refused: the queue's whole value is
          # that a closure says what happened.
          if "$bin" update T1 --status done; then
            echo "::error::a closure with no note was accepted"
            exit 1
          fi
          "$bin" update T1 --status done --note "abc123 - did the thing, suite green"
          "$bin" report | grep -q "0 open of 1 total"

          # Pruning writes nothing without the token it printed, and keeps what
          # it removes.
          "$bin" prune >/dev/null
          [ "$("$bin" count)" = 1 ] || { echo "::error::prune wrote without a token"; exit 1; }
          token="$("$bin" prune 2>&1 >/dev/null | sed -n 's/^  CONFIRM=//p')"
          [ -n "$token" ] || { echo "::error::prune printed no confirmation token"; exit 1; }
          CONFIRM="$token" "$bin" prune >/dev/null
          [ "$("$bin" count)" = 0 ] || { echo "::error::prune left the task in place"; exit 1; }
          archive="$work/queue.$(date -u +%Y-%m-%d).archive.json"
          [ -f "$archive" ] || { echo "::error::prune deleted the task instead of archiving it"; exit 1; }
          [ "$(TODO_JSON="$archive" "$bin" count)" = 1 ] || { echo "::error::the archive does not hold the task"; exit 1; }

          # An out-of-vocabulary priority must fail at parse, which is the point
          # of the types replacing a validation pass.
          sed 's/"high"/"critical"/' "$archive" > "$work/bad.json"
          if TODO_JSON="$work/bad.json" "$bin" check; then
            echo "::error::an out-of-enum priority was accepted"
            exit 1
          fi

      - name: Upload the register artifacts
        if: needs.scope.outputs.planning_commands == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: registers-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bugs
            target/${{ matrix.target }}/release/bugs.exe
            target/${{ matrix.target }}/release/todo
            target/${{ matrix.target }}/release/todo.exe
          if-no-files-found: error

  cygwin:
    # T84a: x86_64-pc-cygwin is tier 3 (no prebuilt std), so this is its own
    # job rather than a sixth `native` matrix leg -- it needs a nightly
    # toolchain with -Z build-std and a Cygwin install the other four
    # platforms have no use for, not just a different os/target pair.
    #
    # Gated the same way `native` is gated (needs.scope.outputs.scope !=
    # 'none'), rather than a parallel selective-compilation mechanism of its
    # own: interactive-shell's other per-target builds already ride on that
    # same job-level condition with no scope flag of their own (see the
    # `native` job's own comment), and this is one more per-target build of
    # the same crate.
    #
    # Cygwin's own libc bindings for openpty/setsid/ioctl/setpgid/kill are an
    # UNVERIFIED assumption T84a's own ticket does not independently audit;
    # this leg is what would surface an incompatibility, by actually
    # spawning and driving a real Cygwin bash, not just linking one.
    name: x86_64-pc-cygwin builds and drives a real Cygwin bash
    runs-on: windows-latest
    needs: scope
    if: needs.scope.outputs.scope != 'none'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Same MAX_PATH concern as the native job's own windows-latest leg.
          sparse-checkout: |
            src
            Cargo.toml
            Cargo.lock
            rust-toolchain.toml
            .github/cygwin-drive-bash-check.sh

      - name: Install Cygwin (gcc-core, gcc-g++)
        uses: cygwin/cygwin-install-action@v6
        with:
          install-dir: 'D:\cygwin'
          packages: |
            gcc-core
            gcc-g++

      # pwsh, not bash: cygwin-install-action prepends Cygwin's own bin dir
      # to PATH, so `shell: bash` resolves to Cygwin's bash rather than
      # Git-Bash from this point on. Invoking rustup/cargo (native Windows
      # executables) through it corrupted an argument in W19's own scratch
      # run (a literal embedded newline landed inside a flag), and even
      # GitHub Actions' own auto-generated `shell: bash` wrapper script
      # (its "set -eo pipefail" startup line) hit the identical corruption
      # when Cygwin's bash ran it. pwsh avoids that translation layer for
      # the rustup/cargo steps; driving the Cygwin-linked binary itself
      # uses Cygwin's bash directly against a real, committed script file
      # (plain LF line endings, never auto-generated), which does not hit
      # whatever GitHub Actions' own script-file generation does
      # differently.
      - name: Install nightly Rust with rust-src
        shell: pwsh
        run: rustup toolchain install nightly --component rust-src

      - name: Build interactive-shell for x86_64-pc-cygwin
        shell: pwsh
        env:
          # Cygwin's own gcc (plain `gcc`, not an x86_64-pc-cygwin-gcc-
          # prefixed binary -- confirmed in W19's own scratch run) is a
          # sufficient linker; no cross-compiler package is installed.
          CARGO_TARGET_X86_64_PC_CYGWIN_LINKER: gcc
        run: |
          cargo +nightly build -Z build-std=std,panic_abort --release `
            --target x86_64-pc-cygwin `
            -p interactive-shell --bin interactive-shell --bin interactive-shell-input

      - name: Drive a real Cygwin bash through the built wrapper
        shell: pwsh
        run: |
          # A CRLF checkout makes Cygwin's bash read "set -euo pipefail\r" as an
          # option named "pipefail<CR>" and fail as an invalid option name, so
          # strip the CRs before handing the file to bash.
          $winPath = "$env:GITHUB_WORKSPACE/.github/cygwin-drive-bash-check.sh"
          (Get-Content -Raw $winPath) -replace "`r`n", "`n" | Set-Content -NoNewline -Path $winPath

          # Cygwin's bash rejects a native Windows path outright ("No such
          # file or directory") -- cygpath converts it to the /cygdrive/...
          # form bash actually resolves.
          $script = & D:\cygwin\bin\cygpath.exe -u $winPath
          D:\cygwin\bin\bash.exe --login $script

  msys2:
    # T84c: MSYS2's own research (05-msys2-research, W23) found MSYS2 needs
    # no distinct Rust target at all -- MSYS2 itself builds its official
    # `rust` package by reusing x86_64-pc-cygwin unchanged, linking with its
    # own gcc (msys-2.0.dll) instead of Cygwin's (cygwin1.dll). Same job
    # shape as the cygwin job above, for the same reason (tier 3, needs
    # nightly + -Z build-std, a toolchain install the other platforms have
    # no use for).
    name: x86_64-pc-cygwin (MSYS2-linked) builds and drives a real MSYS2 bash
    runs-on: windows-latest
    needs: scope
    if: needs.scope.outputs.scope != 'none'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            src
            Cargo.toml
            Cargo.lock
            rust-toolchain.toml
            .github/cygwin-drive-bash-check.sh

      - name: Install MSYS2 (native MSYS gcc, not mingw-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: gcc

      # interactive-shell's own session-socket directory check (unmodified
      # POSIX code, the cygwin job above already proves it unchanged) needs
      # its parent directory's permission bits to read exactly 0700 --
      # MSYS2 defaults to `noacl` mounts (Cygwin defaults to `acl` on), so
      # chmod bits are not actually enforced or reported there, and that
      # check fails ("socket parent must be a private directory owned by
      # the current user"). Enabling acl for MSYS2's own root mount
      # (NTFS-only, which this runner is) matches Cygwin's default.
      - name: Enable ACL on MSYS2's root mount (matches Cygwin's default)
        shell: pwsh
        run: |
          $msysRoot = "$env:RUNNER_TEMP\msys64"
          Add-Content -Path "$msysRoot\etc\fstab" -Value "$msysRoot / ntfs override,acl,binary,posix=1 0 0"

      - name: Install nightly Rust with rust-src
        shell: pwsh
        run: rustup toolchain install nightly --component rust-src

      - name: Build interactive-shell for x86_64-pc-cygwin, linked via MSYS2's gcc
        shell: pwsh
        run: |
          # setup-msys2 installs to $RUNNER_TEMP\msys64 (D:\a\_temp\msys64
          # on this runner type), not C:\msys64 -- not a documented stable
          # contract, confirmed empirically.
          #
          # Invoking gcc.exe by its full path is not enough on its own: gcc
          # still resolves its OWN internal ld/plugins via PATH, and this
          # runner already has at least one other x86_64-pc-cygwin-capable
          # gcc on PATH (Git for Windows bundles its own under
          # C:\Program Files\Git\usr\lib\gcc\x86_64-pc-cygwin), plus a
          # generic C:\mingw64 toolchain -- linking failed cross-wired
          # between them ("ld.exe: ...msys-lto_plugin.dll: error loading
          # plugin") until MSYS2's own usr\bin was put first on PATH, so
          # gcc finds its own matching ld/plugins ahead of either.
          $env:PATH = "$env:RUNNER_TEMP\msys64\usr\bin;$env:PATH"
          $env:CARGO_TARGET_X86_64_PC_CYGWIN_LINKER = "$env:RUNNER_TEMP\msys64\usr\bin\gcc.exe"
          cargo +nightly build -Z build-std=std,panic_abort --release `
            --target x86_64-pc-cygwin `
            -p interactive-shell --bin interactive-shell --bin interactive-shell-input

      # Reuses the cygwin job's own script verbatim: the built binary lands
      # at the same target/x86_64-pc-cygwin/release path regardless of
      # which gcc linked it, and the test itself (spawn bash, type an echo
      # command, confirm the output appears on screen) is identical either
      # way. setup-msys2's own registered `msys2 {0}` shell handles script
      # invocation correctly on its own -- no CRLF-stripping or cygpath
      # dance needed here, unlike the cygwin job (which has no equivalent
      # first-party GitHub Action for that part).
      - name: Drive a real MSYS2 bash through the built wrapper
        shell: msys2 {0}
        run: .github/cygwin-drive-bash-check.sh

  rust-artifact-manifest:
    name: publish Rust artifact hashes
    runs-on: ubuntu-latest
    needs: [scope, native]
    # Only when the planning commands were actually built. The manifest step
    # asserts it found at least one artifact (`wc -l > 1`), so on a run that
    # skipped that subject this job would fail for the honest reason that
    # there is nothing to hash — a red tick for a run that was correct.
    if: needs.scope.outputs.planning_commands == 'true'
    steps:
      - name: Download every native target bundle
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: planning-commands-*
          path: planning-rust-artifacts
          merge-multiple: true

      - name: Generate the per-target hash manifest
        shell: bash
        run: |
          set -euo pipefail
          : > RUST-ARTIFACTS.tsv
          printf 'target\tfile\tsha256\n' >> RUST-ARTIFACTS.tsv
          : > SHA256SUMS
          while IFS= read -r file; do
            relative="${file#planning-rust-artifacts/}"
            target="${relative%%/*}"
            target_file="${relative#*/}"
            digest="$(sha256sum "$file" | awk '{print $1}')"
            printf '%s\t%s\t%s\n' "$target" "$target_file" "$digest" >> RUST-ARTIFACTS.tsv
            printf '%s  %s\n' "$digest" "$file" >> SHA256SUMS
          done < <(find planning-rust-artifacts -type f | LC_ALL=C sort)
          [ "$(wc -l < RUST-ARTIFACTS.tsv)" -gt 1 ]
          sha256sum -c SHA256SUMS

      - name: Upload the verified artifact bundle and manifest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: planning-rust-artifacts-manifest
          path: |
            planning-rust-artifacts
            RUST-ARTIFACTS.tsv
            SHA256SUMS
          if-no-files-found: error

  shellcheck:
    # Proves: no `warning`-severity shellcheck finding exists in any live shell
    # script, and reports the full finding count so it can be ratcheted.
    #
    # shellcheck is preinstalled on the ubuntu-latest image, so it is invoked
    # directly rather than through ludeeus/action-shellcheck: that keeps the
    # exact file list (tracked *.sh minus archived benchmark output, plus the
    # generated libraries), the severity gate, and the informational report
    # under this workflow's control and adds no third-party action to the
    # supply chain.
    name: No warning-level shellcheck findings in live shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Record the shellcheck version
        run: |
          # Preinstalled on the ubuntu-latest image; install it if that ever
          # changes, so the gate cannot silently stop running.
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version

      - name: Build the generated shell libraries
        run: ./planning/scripts/build-plan-libs.sh

      - name: Collect the live shell scripts
        run: |
          # benchmark/results/** holds archived output snapshots of past runs,
          # not live code, so it is excluded.
          #
          # The compiled plan libraries are generated and untracked (§2.16), so
          # `git ls-files` cannot see them, and shellcheck resolves a
          # `source=` directive ONLY against files given on the same command
          # line. Omitting them does not merely skip linting those files: it
          # makes every variable a sourcing script reads from them look
          # unassigned (SC2154). Append them so the sources stay resolvable.
          {
            git ls-files '*.sh' | grep -v '^benchmark/results/'
            for lib in core crypt document progress table; do
              echo "planning/scripts/plan-$lib-lib.sh"
            done
          } | LC_ALL=C sort -u > /tmp/sh-files.txt
          echo "linting $(wc -l < /tmp/sh-files.txt) files"

      - name: Full report (informational — the count to ratchet down)
        continue-on-error: true
        run: |
          xargs shellcheck -s bash -f gcc < /tmp/sh-files.txt > /tmp/shellcheck.txt || true
          sed -n '1,400p' /tmp/shellcheck.txt
          printf 'errors:   %s\n' "$(grep -c ': error:' /tmp/shellcheck.txt || true)"
          printf 'warnings: %s\n' "$(grep -c ': warning:' /tmp/shellcheck.txt || true)"
          printf 'notes:    %s\n' "$(grep -c ': note:' /tmp/shellcheck.txt || true)"
          printf 'total:    %s\n' "$(wc -l < /tmp/shellcheck.txt)"

      - name: Fail on warning-severity findings
        run: xargs shellcheck -s bash --severity=warning < /tmp/sh-files.txt

  mermaid-render:
    # Proves: every fenced mermaid block in the repo's markdown is SYNTACTICALLY
    # valid — mermaid-cli parses and renders it. It proves nothing about
    # accuracy: a diagram can render perfectly and still describe a flow the code
    # does not have. planning/tests/test-mermaid-accuracy.sh owns the existence
    # checks (script, artifact, node id, function) and runs mmdc too when the dev
    # flake provides it; this job is the leg that cannot be skipped, and it lives
    # here rather than only in the suite because the suite may not assume node
    # (CODE-STYLE.md section 1).
    name: Every mermaid diagram renders (syntax only, proves nothing about accuracy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Record the node under test
        run: node --version

      - name: Extract every fenced mermaid block
        run: |
          # benchmark/results/** is archived output, not live documentation.
          mkdir -p /tmp/mermaid
          for doc in $(git ls-files '*.md' | grep -v '^benchmark/results/'); do
            tag="$(printf '%s' "$doc" | tr '/' '-')"
            awk -v out=/tmp/mermaid -v tag="$tag" '
              !inb && /^```mermaid[[:space:]]*$/ { inb = 1; f = sprintf("%s/%s@%d.mmd", out, tag, NR); next }
              inb && /^```/ { inb = 0; next }
              inb { print > f }
            ' "$doc"
          done
          blocks="$(find /tmp/mermaid -name '*.mmd' | wc -l)"
          find /tmp/mermaid -name '*.mmd' | sort
          echo "mermaid blocks: $blocks"
          if [ "$blocks" -eq 0 ]; then
            echo "::error::no mermaid block found — the extractor or the docs changed shape"
            exit 1
          fi

      - name: Render each block with mermaid-cli
        run: |
          # Pinned to the version the dev flake ships, so a local run and CI
          # agree on the parser. --no-sandbox: chromium has no user namespace on
          # the runner.
          printf '%s\n' '{ "args": ["--no-sandbox", "--disable-dev-shm-usage"] }' > /tmp/puppeteer.json
          rc=0
          for f in /tmp/mermaid/*.mmd; do
            if ! npx -y @mermaid-js/mermaid-cli@11.16.0 -q \
                -p /tmp/puppeteer.json -i "$f" -o "$f.svg"; then
              echo "::error::mermaid rejected $(basename "$f" .mmd | tr '@' ':')"
              rc=1
            fi
          done
          exit "$rc"
